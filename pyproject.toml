[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qksvm"
version = "0.1.0"
description = "A controlled comparison of classical and quantum-kernel SVMs on Fashion-MNIST."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Praneeth" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "joblib>=1.3",
    "tabulate>=0.9",
]

[project.optional-dependencies]
# Qiskit is only needed to cross-check the simulator (tests) and to draw circuits.
dev = [
    "qiskit>=2.0",
    "qiskit-machine-learning>=0.8",
    "pytest>=8",
    "ruff==0.16.10",  # pinned so that lint/format results are reproducible
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "D", "NPY", "RUF"]
ignore = [
    "N802", "N803", "N806",  # X, K, C ... follow the usual maths/scikit-learn naming
    "D203", "D213",  # pick one docstring layout (D211 + D212)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
